<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Glow effects -->
  <circle cx="400" cy="225" r="180" fill="#3b82f6" opacity="0.04"/>
  <circle cx="400" cy="225" r="120" fill="#06b6d4" opacity="0.05"/>

  <!-- Central API Hub -->
  <rect x="330" y="165" width="140" height="120" rx="16" fill="#1e293b" stroke="url(#accent)" stroke-width="2"/>
  <rect x="330" y="165" width="140" height="120" rx="16" fill="#3b82f6" opacity="0.08"/>

  <!-- API text inside hub -->
  <text x="400" y="210" font-family="monospace" font-size="28" font-weight="bold" fill="#3b82f6" text-anchor="middle">API</text>
  <text x="400" y="235" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">REST / GraphQL</text>

  <!-- Status indicators inside hub -->
  <circle cx="370" cy="260" r="4" fill="#10b981"/>
  <text x="380" y="264" font-family="monospace" font-size="10" fill="#10b981">200 OK</text>

  <!-- Left Service Box 1 - Database -->
  <rect x="80" y="80" width="150" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="110" cy="108" r="12" fill="#8b5cf6" opacity="0.2"/>
  <rect x="104" y="102" width="12" height="3" rx="1" fill="#8b5cf6"/>
  <rect x="104" y="107" width="12" height="3" rx="1" fill="#8b5cf6"/>
  <rect x="104" y="112" width="12" height="3" rx="1" fill="#8b5cf6"/>
  <text x="130" y="112" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Database</text>
  <text x="100" y="140" font-family="monospace" font-size="9" fill="#64748b">PostgreSQL • MongoDB</text>

  <!-- Left Service Box 2 - Auth -->
  <rect x="80" y="290" width="150" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="110" cy="318" r="12" fill="#10b981" opacity="0.2"/>
  <rect x="102" y="310" width="16" height="16" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <rect x="108" y="314" width="4" height="6" rx="1" fill="#10b981"/>
  <text x="130" y="322" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Auth</text>
  <text x="100" y="350" font-family="monospace" font-size="9" fill="#64748b">OAuth 2.0 • JWT</text>

  <!-- Right Service Box 1 - Frontend -->
  <rect x="570" y="80" width="150" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="600" cy="108" r="12" fill="#06b6d4" opacity="0.2"/>
  <text x="594" y="114" font-family="monospace" font-size="14" fill="#06b6d4">&lt;/&gt;</text>
  <text x="620" y="112" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Frontend</text>
  <text x="590" y="140" font-family="monospace" font-size="9" fill="#64748b">React • Next.js</text>

  <!-- Right Service Box 2 - Cloud -->
  <rect x="570" y="290" width="150" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="600" cy="318" r="12" fill="#f59e0b" opacity="0.2"/>
  <text x="594" y="323" font-family="sans-serif" font-size="14" fill="#f59e0b">☁</text>
  <text x="620" y="322" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Cloud</text>
  <text x="590" y="350" font-family="monospace" font-size="9" fill="#64748b">AWS • GCP • Azure</text>

  <!-- Connection lines - Left to Center -->
  <line x1="230" y1="120" x2="330" y2="195" stroke="url(#accent2)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <line x1="230" y1="330" x2="330" y2="255" stroke="url(#green)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Connection lines - Center to Right -->
  <line x1="470" y1="195" x2="570" y2="120" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <line x1="470" y1="255" x2="570" y2="330" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Data flow dots on lines -->
  <circle cx="280" cy="157" r="3" fill="#8b5cf6" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="293" r="3" fill="#10b981" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="157" r="3" fill="#06b6d4" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="293" r="3" fill="#f59e0b" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- JSON snippet bottom left -->
  <rect x="60" y="390" width="180" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8"/>
  <text x="75" y="410" font-family="monospace" font-size="9" fill="#64748b">{</text>
  <text x="85" y="422" font-family="monospace" font-size="9"><tspan fill="#3b82f6">"status"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#10b981">"automated"</tspan></text>
  <text x="75" y="432" font-family="monospace" font-size="9" fill="#64748b">}</text>

  <!-- Webhook badge top right -->
  <rect x="570" y="195" width="140" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9"/>
  <text x="590" y="215" font-family="monospace" font-size="10" fill="#f59e0b">⚡ Webhook</text>
  <text x="590" y="235" font-family="monospace" font-size="9"><tspan fill="#64748b">POST /api/v1/</tspan></text>

  <!-- Automation gear top center -->
  <g transform="translate(400, 55)">
    <circle cx="0" cy="0" r="18" fill="#1e293b" stroke="url(#accent)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <g stroke="#3b82f6" stroke-width="2">
      <line x1="0" y1="-14" x2="0" y2="-10"/>
      <line x1="0" y1="10" x2="0" y2="14"/>
      <line x1="-14" y1="0" x2="-10" y2="0"/>
      <line x1="10" y1="0" x2="14" y2="0"/>
      <line x1="-10" y1="-10" x2="-7" y2="-7"/>
      <line x1="7" y1="7" x2="10" y2="10"/>
      <line x1="10" y1="-10" x2="7" y2="-7"/>
      <line x1="-7" y1="7" x2="-10" y2="10"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 55" to="360 400 55" dur="12s" repeatCount="indefinite" additive="sum"/>
  </g>
  <text x="400" y="88" font-family="sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Automation</text>

  <!-- Bottom label -->
  <text x="400" y="435" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="2">SEAMLESS INTEGRATION • ZERO DOWNTIME</text>
</svg>
